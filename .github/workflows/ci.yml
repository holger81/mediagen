name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: |
          export CACHE_DIR="${RUNNER_TEMP}/mediagen-cache"
          mkdir -p "$CACHE_DIR"
          pytest -q
